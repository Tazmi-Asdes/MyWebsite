<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 后台管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <!-- Logo / Title -->
            <div class="text-center mb-12">
                <h1 class="text-3xl font-light text-gray-900 mb-2">后台管理系统</h1>
                <p class="text-sm text-gray-500 uppercase tracking-wider">Admin Dashboard</p>
            </div>

            <!-- Login Form -->
            <div class="border border-gray-200 p-8">
                <form>
                    <!-- Username Field -->
                    <div class="mb-6">
                        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">
                            用户名
                        </label>
                        <input type="text"
                               placeholder="请输入用户名"
                               class="w-full px-4 py-3 border border-gray-300 focus:border-black focus:outline-none">
                    </div>

                    <!-- Password Field -->
                    <div class="mb-6">
                        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">
                            密码
                        </label>
                        <input type="password"
                               placeholder="请输入密码"
                               class="w-full px-4 py-3 border border-gray-300 focus:border-black focus:outline-none">
                    </div>

                    <!-- Remember Me -->
                    <div class="mb-8">
                        <label class="flex items-center text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" class="mr-2">
                            记住我
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                            class="w-full bg-black text-white py-3 font-light hover:bg-gray-800 transition">
                        登录
                    </button>
                </form>

                <!-- Error Message (Hidden by default) -->
                <div class="mt-6 p-4 border border-gray-300 bg-gray-50 text-sm text-gray-700" style="display:none;">
                    <div class="flex items-start">
                        <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span>用户名或密码错误，请重试</span>
                    </div>
                </div>
            </div>

            <!-- Footer Info -->
            <div class="mt-8 text-center text-xs text-gray-500">
                <p>请使用管理员账号登录</p>
            </div>
        </div>
    </div>

    <!-- 设计说明 -->
    <div style="display:none;">
        <!--
        页面：登录页 (/login)

        设计风格：极简黑白风格（Ant Design Pro 风格基础上简化）
        - 纯白背景
        - 黑色按钮
        - 细线边框
        - 无圆角
        - 无阴影
        - 居中布局

        布局结构：
        1. 垂直居中的登录表单
           - Logo/标题
           - 表单区域（边框包裹）
           - 用户名输入框
           - 密码输入框
           - 记住我复选框
           - 登录按钮
           - 错误提示（条件显示）

        设计元素：
        - 标题：font-light, text-3xl
        - 标签：uppercase, tracking-wider
        - 输入框：border, focus:border-black
        - 按钮：bg-black, 全宽
        - 错误提示：border + bg-gray-50

        表单验证：
        - 必填字段验证
        - JWT Token 认证
        - 错误提示显示

        功能：
        - 用户登录
        - JWT Token 获取
        - 自动跳转到 Dashboard
        - 记住登录状态
        -->
    </div>
</body>
</html>

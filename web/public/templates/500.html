<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-brand" href="/">MyWebsite</a>
      <details class="site-menu">
        <summary class="menu-button">菜单</summary>
        <nav class="site-nav" aria-label="主要导航">
          <a href="/">首页</a>
          <a href="/articles">文章</a>
          <a href="/projects">项目</a>
          <a href="/about">关于</a>
        </nav>
      </details>
    </div>
  </header>
  <main id="main-content" class="page-shell">
    <p class="eyebrow">{{.Eyebrow}}</p>
    <h1>{{.Heading}}</h1>
    <section class="empty-state temporary-fault" aria-live="polite">
      <p>{{.EmptyText}}</p>
      <p><a class="text-link" href="">重试</a></p>
      <p><a class="text-link" href="/">返回首页</a></p>
      <p><a class="text-link" href="/articles">返回文章列表</a></p>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© {{.Year}} MyWebsite</span>
    </div>
  </footer>
</body>
</html>

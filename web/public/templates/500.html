<!doctype html>
<html lang="zh-CN">
<head>
{{template "public-head-meta" .}}
{{template "public-head-assets" .}}
</head>
<body>
{{template "public-site-header" ""}}
  <main id="main-content" class="error-page">
    <section aria-labelledby="service-error-heading">
      <p class="error-code" aria-hidden="true">500</p>
      <h1 id="service-error-heading">{{.Heading}}</h1>
      <p>{{.EmptyText}}</p>
      <div class="button-row">
        <a class="button" href="">重新尝试</a>
        <a class="button button--secondary" href="/">返回首页</a>
      </div>
    </section>
  </main>
{{template "public-site-footer" .}}
</body>
</html>

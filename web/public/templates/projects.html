<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}}</title>
  <script src="/assets/site.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-brand" href="/">Tazmi-Website</a>
      <details class="site-menu" open>
        <summary class="menu-button">菜单</summary>
        <nav class="site-nav" aria-label="主要导航">
          <a href="/">首页</a>
          <a href="/articles">文章</a>
          <a class="active" href="/projects" aria-current="page">项目</a>
          <a href="/about">关于</a>
          <button class="theme-toggle" type="button" data-theme-toggle hidden aria-pressed="false" aria-label="当前主题，点击切换到另一主题">
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5a8.5 8.5 0 1 0 11.7 11.7Z"></path></svg>
          </button>
        </nav>
      </details>
    </div>
  </header>
  <main id="main-content">
    <header class="page-heading">
      <div class="container">
        <p class="eyebrow">{{.Eyebrow}}</p>
        <h1>{{.Heading}}</h1>
        <p class="lede">{{.Description}}</p>
      </div>
    </header>
    <section class="section" aria-label="项目列表">
      <div class="container">
        {{if .Projects}}
        <div class="grid grid--three project-grid">
          {{range .Projects}}
          <article class="card project-card">
            <div class="project-card__media"><img src="{{.ImageURL}}" alt="{{.ImageAlt}}"></div>
            <div class="project-card__footer">
              <h2>{{.Name}}</h2>
              {{if .HasGitHub}}<a href="{{.GitHubURL}}" target="_blank" rel="noopener noreferrer">GitHub</a>{{end}}
            </div>
          </article>
          {{end}}
        </div>
        {{else}}
        <div class="empty-state" aria-live="polite">
          <div>
            <h2>{{.EmptyTitle}}</h2>
            <p>{{.EmptyText}}</p>
          </div>
        </div>
        {{end}}
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© {{.Year}} MyWebsite</span>
    </div>
  </footer>
</body>
</html>

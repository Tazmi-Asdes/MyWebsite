<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{.OpenGraphTitle}}">
  <meta property="og:description" content="{{.OpenGraphDesc}}">
  <title>{{.Title}}</title>
  <script src="/assets/site.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-brand" href="/">Tazmi-Website</a>
      <details class="site-menu" open>
        <summary class="menu-button">菜单</summary>
        <nav class="site-nav" aria-label="主要导航">
          <a href="/">首页</a>
          <a class="active" href="/articles" aria-current="page">文章</a>
          <a href="/projects">项目</a>
          <a href="/about">关于</a>
          <button class="theme-toggle" type="button" data-theme-toggle hidden aria-pressed="false" aria-label="当前主题，点击切换到另一主题">
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5a8.5 8.5 0 1 0 11.7 11.7Z"></path></svg>
          </button>
        </nav>
      </details>
    </div>
  </header>
  <main id="main-content">
    <header class="article-header reading-container">
      <p class="eyebrow">实践记录</p>
      <h1>{{.Heading}}</h1>
      {{if .PublishedDate}}<time datetime="{{.PublishedDate}}">{{.PublishedDate}}</time>{{end}}
    </header>
    <div class="article-shell{{if not .TOC}} article-shell--single{{end}}">
      <article class="article-content">
        {{if .TOC}}
        <details class="toc-mobile">
          <summary>目录</summary>
          <ol>{{range .TOC}}<li class="toc-level-{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}</ol>
        </details>
        {{end}}
        <div class="article-body">{{.BodyHTML}}</div>
        <div class="article-back"><a class="text-link" href="/articles">← 返回文章列表</a></div>
      </article>
      {{if .TOC}}
      <nav class="toc" aria-label="文章目录">
        <h2>目录</h2>
        <ol>{{range .TOC}}<li class="toc-level-{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>{{end}}</ol>
      </nav>
      {{end}}
    </div>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© {{.Year}} MyWebsite</span>
    </div>
  </footer>
</body>
</html>

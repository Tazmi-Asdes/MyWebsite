<!doctype html>
<html lang="zh-CN">
<head>
{{template "public-head-meta" .}}
{{template "public-head-assets" .}}
</head>
<body>
{{template "public-site-header" "about"}}
  <main id="main-content" class="container">
    <div class="about-layout">
      <header class="about-profile">
        <img class="avatar" src="{{.AvatarURL}}" alt="{{.DisplayName}}的头像">
        <h1>{{.DisplayName}}</h1>
        <p class="muted">个人网站</p>
      </header>
      <div>
        <section class="about-block" aria-labelledby="stats-heading">
          <h2 id="stats-heading">内容</h2>
          <div class="stats">
            <div class="stat"><strong>{{.ArticleCount}}</strong><span>已发布文章</span></div>
            <div class="stat"><strong>{{.ProjectCount}}</strong><span>公开项目</span></div>
          </div>
        </section>
        <section class="about-block" aria-labelledby="interests-heading">
          <h2 id="interests-heading">兴趣</h2>
          <p>耍起嘛,每天用ai整点有的没的好舒服啊</p>
        </section>
        <section class="about-block" aria-labelledby="contact-heading">
          <h2 id="contact-heading">联系与公开账号</h2>
          <div class="contact-list">
            <a href="mailto:2926238971@qq.com">2926238971@qq.com</a>
            <a href="https://github.com/Tazmi-Asdes" target="_blank" rel="noopener noreferrer">github.com/Tazmi-Asdes</a>
          </div>
        </section>
      </div>
    </div>
  </main>
{{template "public-site-footer" .}}
</body>
</html>

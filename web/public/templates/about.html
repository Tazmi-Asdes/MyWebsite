<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-brand" href="/">MyWebsite</a>
      <details class="site-menu" open>
        <summary class="menu-button">菜单</summary>
        <nav class="site-nav" aria-label="主要导航">
          <a href="/">首页</a>
          <a href="/articles">文章</a>
          <a href="/projects">项目</a>
          <a class="active" href="/about" aria-current="page">关于</a>
        </nav>
      </details>
    </div>
  </header>
  <main id="main-content" class="container">
    <div class="about-layout">
      <header class="about-profile">
        <img class="avatar" src="{{.AvatarURL}}" alt="{{.DisplayName}}的默认头像">
        <h1>{{.DisplayName}}</h1>
        <p class="muted">个人网站</p>
      </header>
      <div>
        <section class="about-block" aria-labelledby="stats-heading">
          <h2 id="stats-heading">内容</h2>
          <div class="stats">
            <div class="stat"><strong>{{.ArticleCount}}</strong><span>已发布文章</span></div>
            <div class="stat"><strong>{{.ProjectCount}}</strong><span>公开项目</span></div>
          </div>
        </section>
        <section class="about-block" aria-labelledby="interests-heading">
          <h2 id="interests-heading">兴趣</h2>
          <p>耍起嘛,每天用ai整点有的没的好舒服啊</p>
        </section>
        <section class="about-block" aria-labelledby="contact-heading">
          <h2 id="contact-heading">联系与公开账号</h2>
          <div class="contact-list">
            <a href="mailto:2926238971@qq.com">hello@example.com</a>
            <a href="https://github.com/Tazmi-Asdes" target="_blank" rel="noopener noreferrer">github.com/example</a>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>© {{.Year}} MyWebsite</span>
    </div>
  </footer>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>服务暂时不可用</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f2ed; color: #2f2a25; }
      main { max-width: 36rem; margin: 2rem; padding: 2rem; border: 1px solid #d8cec1; border-radius: 1rem; background: #fffdf9; box-shadow: 0 1rem 3rem rgb(47 42 37 / 10%); }
      h1 { margin-top: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      p { line-height: 1.7; }
      code { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>站点正在维护</h1>
      <p>服务暂时不可用，请稍后再试。</p>
      <p><code>HTTP 503</code></p>
    </main>
  </body>
</html>

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # OpenResty owns the public /admin redirect.  Keeping this redirect here
    # also makes the admin container safe to probe directly.
    location = /admin {
        return 308 /admin/;
    }

    # This is the only SPA history fallback in the deployment.  API and
    # public-page 404 responses never pass through this container.
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        return 404;
    }
}

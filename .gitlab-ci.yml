# Shell Runner performs image build/push and production actions. Verify and
# Trivy jobs run on the Docker security Runner without a host Docker socket.

stages:
  - verify
  - build
  - scan
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

variables:
  MYWEBSITE_RUNNER_TAG: "server"
  MYWEBSITE_SECURITY_RUNNER_TAG: "security"
  COMPOSE_PROJECT_NAME: "mywebsite"
  MYSQL_NETWORK_NAME: "1panel-network"
  APP_PORT: "18080"
  ADMIN_WEB_PORT: "18081"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.org"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24.16.0"
  DEPLOY_ROOT: "/opt/mywebsite"
  PRODUCTION_URL: "https://tazmi.online"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  PULL_BASE_IMAGES:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Set true in a manual default-branch pipeline to refresh Docker base images."
  PIPELINE_ACTION:
    value: "deploy"
    options:
      - "deploy"
      - "rollback"
    description: "Choose deploy or rollback for a protected default-branch web pipeline."
  ALLOW_DEPLOY_CONFIG_CHANGE:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Set true only after backup and compatibility review for a config change."
  CONFIG_CHANGE_CONFIRMATION:
    value: ""
    description: "For an authorized config change, enter I_HAVE_BACKUP_AND_CONFIRMED_COMPATIBILITY."

.verify_job:
  stage: verify
  tags:
    - "$MYWEBSITE_SECURITY_RUNNER_TAG"
  interruptible: true
  timeout: 20 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  rules:
    - if: '$PIPELINE_ACTION == "rollback"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

.trivy_job:
  stage: scan
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: [""]
  tags:
    - "$MYWEBSITE_SECURITY_RUNNER_TAG"
  interruptible: false
  timeout: 30 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.mywebsite-docker-config-$CI_JOB_ID"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
    MYWEBSITE_TRIVY_DB_REPOSITORIES: "registry.gitlab.com/gitlab-org/security-products/dependencies/trivy-db:2 ghcr.io/aquasecurity/trivy-db:2"
    MYWEBSITE_TRIVY_DB_DOWNLOAD_TIMEOUT: "3m"
  cache:
    key: trivy-db-v1
    paths:
      - .cache/trivy/
    policy: pull-push
    when: always
  before_script:
    - |
      set -eu
      test -n "$CI_REGISTRY"
      test -n "$CI_REGISTRY_USER"
      test -n "$CI_REGISTRY_PASSWORD"
      mkdir -p "$DOCKER_CONFIG" "$CI_PROJECT_DIR/.cache/trivy" "$CI_PROJECT_DIR/test-results/deploy"
      printf '%s' "$CI_REGISTRY_PASSWORD" | trivy registry login \
        --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - |
      if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        rm -rf -- "$DOCKER_CONFIG"
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/deploy/app-vulnerabilities.json
      - test-results/deploy/admin-web-vulnerabilities.json

.shell_docker_job:
  tags:
    - "$MYWEBSITE_RUNNER_TAG"
  interruptible: false
  variables:
    DOCKER_CONFIG: "$CI_BUILDS_DIR/.mywebsite-docker-config-$CI_JOB_ID"
  after_script:
    - |
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true
      fi
      if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        rm -rf -- "$DOCKER_CONFIG"
      fi
      if [ -n "${DEPLOY_ROOT:-}" ] && [ -n "${CI_PROJECT_DIR:-}" ] && [ "$DEPLOY_ROOT/deploy/env.production" != "$CI_PROJECT_DIR/deploy/env.production" ]; then
        rm -f -- "$CI_PROJECT_DIR/deploy/env.production"
      fi

.production_job:
  extends: .shell_docker_job
  timeout: 30 minutes
  retry: 0
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |
      set -eu
      test -n "$CI_REGISTRY"
      test -n "$CI_REGISTRY_USER"
      test -n "$CI_REGISTRY_PASSWORD"
      mkdir -p "$DOCKER_CONFIG" "$CI_PROJECT_DIR/test-results/deploy"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login \
        --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

verify_go:
  extends: .verify_job
  image: golang:1.27.1-alpine
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/
    policy: pull-push
  script:
    - |
      set -eu
      apk add --no-cache bash git >/dev/null
      export GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"
      export GOCACHE="$CI_PROJECT_DIR/.cache/go-build"
      export GOTMPDIR=/tmp/gotmp
      export GOBIN=/tmp/bin
      export PATH="$GOBIN:$PATH"
      mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR" "$GOBIN" "$CI_PROJECT_DIR/test-results"
      go install gotest.tools/gotestsum@v1.13.0
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        printf 'gofmt check failed; run gofmt on these files:\n%s\n' "$unformatted" >&2
        exit 1
      fi
      go vet ./...
      gotestsum --junitfile "$CI_PROJECT_DIR/test-results/go-junit.xml" -- ./...
      for script in deploy/scripts/*.sh; do bash -n "$script"; done
      bash deploy/tests/build-scan-test.sh
      bash deploy/tests/deploy-production-test.sh
    - git diff --check
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results/go-junit.xml
    paths:
      - test-results/go-junit.xml

verify_admin:
  extends: .verify_job
  image: node:24.16.0-alpine
  cache:
    key:
      files:
        - web/admin/package-lock.json
    paths:
      - .cache/npm/
    policy: pull-push
  script:
    - |
      set -eu
      apk add --no-cache git >/dev/null
      export NPM_CONFIG_CACHE="$CI_PROJECT_DIR/.cache/npm"
      mkdir -p "$NPM_CONFIG_CACHE" "$CI_PROJECT_DIR/test-results"
      rm -rf /tmp/mywebsite-admin
      cp -R "$CI_PROJECT_DIR/web/admin" /tmp/mywebsite-admin
      cd /tmp/mywebsite-admin
      npm ci --prefer-offline --ignore-scripts --no-audit --no-fund
      npm run typecheck
      npm test -- --reporter=junit --outputFile="$CI_PROJECT_DIR/test-results/admin-junit.xml"
      npm run build
      cd "$CI_PROJECT_DIR"
    - git diff --check
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results/admin-junit.xml
    paths:
      - test-results/admin-junit.xml

build_images:
  extends: .shell_docker_job
  stage: build
  timeout: 45 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  resource_group: image-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $PIPELINE_ACTION == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash deploy/scripts/build-images.sh
  artifacts:
    expire_in: 14 days
    reports:
      dotenv: release.env
    paths:
      - release.env

scan_images:
  extends: .trivy_job
  needs:
    - job: build_images
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $PIPELINE_ACTION == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - sh deploy/scripts/scan-images.sh

scan_main_images:
  extends: .trivy_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - |
      set -eu
      export APP_IMAGE_REF="${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHA}"
      export ADMIN_WEB_IMAGE_REF="${CI_REGISTRY_IMAGE}/admin-web:${CI_COMMIT_SHA}"
      sh deploy/scripts/scan-images.sh

deploy_prod:
  extends: .production_job
  stage: deploy
  resource_group: production
  environment:
    name: production
    url: "$PRODUCTION_URL"
  needs:
    - job: build_images
      artifacts: true
    - job: scan_images
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $PIPELINE_ACTION == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash deploy/scripts/deploy-production.sh deploy
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/deploy/

rollback_prod:
  extends: .production_job
  stage: deploy
  resource_group: production
  environment:
    name: production
    url: "$PRODUCTION_URL"
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PIPELINE_ACTION == "rollback" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash deploy/scripts/deploy-production.sh rollback
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/deploy/

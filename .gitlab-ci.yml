# Linux Shell Runner contract for deployment:
# - the runner is tagged with MYWEBSITE_RUNNER_TAG (default: server);
# - the runner can execute Docker CLI commands and access the Docker daemon;
# - deploy/env.production, the database password file, the uploads directory,
#   and the 1Panel network are provisioned outside Git and outside artifacts.
# Verification jobs use the Docker executor tagged with
# MYWEBSITE_SECURITY_RUNNER_TAG (default: security).

stages:
  - verify
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

variables:
  MYWEBSITE_RUNNER_TAG: "server"
  MYWEBSITE_SECURITY_RUNNER_TAG: "security"
  COMPOSE_PROJECT_NAME: "mywebsite"
  MYSQL_NETWORK_NAME: "1panel-network"
  APP_PORT: "18080"
  ADMIN_WEB_PORT: "18081"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.org"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"
  DEPLOY_ROOT: "/opt/mywebsite"
  PRODUCTION_URL: "https://tazmi.online"
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  BUILDKIT_PROGRESS: "plain"
  PULL_BASE_IMAGES: "false"
# Set PULL_BASE_IMAGES=true in a manual pipeline when refreshing base images.

verify_go:
  stage: verify
  image: golang:1.27.1-alpine
  tags:
    - "$MYWEBSITE_SECURITY_RUNNER_TAG"
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - |
      set -eu
      apk add --no-cache git >/dev/null
      export GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"
      export GOCACHE="$CI_PROJECT_DIR/.cache/go-build"
      export GOTMPDIR=/tmp/gotmp
      export GOBIN=/tmp/bin
      export PATH="$GOBIN:$PATH"
      mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR" "$GOBIN" "$CI_PROJECT_DIR/test-results"
      go install gotest.tools/gotestsum@v1.13.0
      gotestsum --junitfile "$CI_PROJECT_DIR/test-results/go-junit.xml" -- ./...
    - git diff --check
  artifacts:
    when: always
    reports:
      junit: test-results/go-junit.xml
    paths:
      - test-results/go-junit.xml

verify_admin:
  stage: verify
  image: node:24.16.0-alpine
  tags:
    - "$MYWEBSITE_SECURITY_RUNNER_TAG"
  cache:
    key:
      files:
        - web/admin/package-lock.json
    paths:
      - .cache/npm/
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - |
      set -eu
      apk add --no-cache git >/dev/null
      export NPM_CONFIG_CACHE="$CI_PROJECT_DIR/.cache/npm"
      mkdir -p "$NPM_CONFIG_CACHE" "$CI_PROJECT_DIR/test-results"
      rm -rf /tmp/mywebsite-admin
      cp -R "$CI_PROJECT_DIR/web/admin" /tmp/mywebsite-admin
      cd /tmp/mywebsite-admin
      npm ci --prefer-offline --ignore-scripts --no-audit --no-fund
      npm run typecheck
      npm test -- --reporter=junit --outputFile="$CI_PROJECT_DIR/test-results/admin-junit.xml"
      cd "$CI_PROJECT_DIR"
    - git diff --check
  artifacts:
    when: always
    reports:
      junit: test-results/admin-junit.xml
    paths:
      - test-results/admin-junit.xml

deploy:
  stage: deploy
  tags:
    - "$MYWEBSITE_RUNNER_TAG"
  variables:
    DOCKER_CONFIG: "$CI_BUILDS_DIR/.mywebsite-docker-config-$CI_PIPELINE_ID"
  resource_group: production
  environment:
    name: production
    url: "$PRODUCTION_URL"
  needs:
    - job: verify_go
    - job: verify_admin
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  after_script:
    - |
      if [ "$DEPLOY_ROOT/deploy/env.production" != "$CI_PROJECT_DIR/deploy/env.production" ]; then
        rm -f -- "$CI_PROJECT_DIR/deploy/env.production"
      fi
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true
      fi
      if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        rm -rf -- "$DOCKER_CONFIG"
      fi
  script:
    - |
      set -eu
      command -v docker >/dev/null
      command -v curl >/dev/null
      command -v install >/dev/null
      docker version
      docker compose version
      curl --version
      install --version
    - |
      set -eu
      env_source="$DEPLOY_ROOT/deploy/env.production"
      env_target="$CI_PROJECT_DIR/deploy/env.production"
      db_password_file="$DEPLOY_ROOT/secrets/db_password"
      redis_password_file="$DEPLOY_ROOT/secrets/redis_password"
      test -r "$env_source"
      test -r "$db_password_file"
      test -s "$db_password_file"
      awk 'NR > 1 { multiple=1 } END { exit multiple ? 1 : 0 }' "$db_password_file"
      test -r "$redis_password_file"
      test -s "$redis_password_file"
      awk 'NR > 1 { multiple=1 } END { exit multiple ? 1 : 0 }' "$redis_password_file"
      test -d "$DEPLOY_ROOT/data/uploads"
      docker network inspect "$MYSQL_NETWORK_NAME" >/dev/null
      redis_config_error="$(awk '
        /^[[:space:]]*(#|$)/ { next }
        /^[[:space:]]*(export[[:space:]]+)?REDIS_(ADDR|URL|PASSWORD_FILE|DB)[[:space:]]*=/ {
          line = $0
          sub(/^[[:space:]]*(export[[:space:]]+)?/, "", line)
          split(line, fields, "=")
          key = fields[1]
          gsub(/[[:space:]]/, "", key)
          if (key == "REDIS_ADDR") addr = 1
          if (key == "REDIS_URL") url = 1
          if (key == "REDIS_PASSWORD_FILE") password_file = 1
          if (key == "REDIS_DB") db = 1
        }
        END {
          if ((password_file || db) && !addr && !url) {
            print "env.production sets REDIS_PASSWORD_FILE or REDIS_DB without REDIS_ADDR or REDIS_URL"
          }
          if (addr && url) {
            print "env.production sets both REDIS_ADDR and REDIS_URL"
          }
        }
      ' "$env_source")"
      if [ -n "$redis_config_error" ]; then
        printf '%s\n' "$redis_config_error" >&2
        exit 1
      fi
      if [ "$env_source" != "$env_target" ]; then
        install -m 0600 "$env_source" "$env_target"
      fi
    - |
      set -eu
      test -n "$CI_REGISTRY"
      test -n "$CI_REGISTRY_IMAGE"
      test -n "$CI_REGISTRY_USER"
      test -n "$CI_REGISTRY_PASSWORD"
      mkdir -p "$DOCKER_CONFIG"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login \
        --username "$CI_REGISTRY_USER" \
        --password-stdin "$CI_REGISTRY"
    - |
      set -eu
      export IMAGE_TAG="$CI_COMMIT_SHA"
      export APP_IMAGE="${CI_REGISTRY_IMAGE}/app"
      export ADMIN_WEB_IMAGE="${CI_REGISTRY_IMAGE}/admin-web"
      docker compose \
        --project-directory "$CI_PROJECT_DIR" \
        -f "$CI_PROJECT_DIR/compose.yaml" \
        -f "$CI_PROJECT_DIR/deploy/compose.onepanel.example.yaml" \
        -f "$CI_PROJECT_DIR/deploy/compose.redis.onepanel.yaml" \
        config --quiet
    - |
      set -eu
      export IMAGE_TAG="$CI_COMMIT_SHA"
      export APP_IMAGE="${CI_REGISTRY_IMAGE}/app"
      export ADMIN_WEB_IMAGE="${CI_REGISTRY_IMAGE}/admin-web"
      compose() {
        docker compose \
          --project-directory "$CI_PROJECT_DIR" \
          -f "$CI_PROJECT_DIR/compose.yaml" \
          -f "$CI_PROJECT_DIR/deploy/compose.onepanel.example.yaml" \
          -f "$CI_PROJECT_DIR/deploy/compose.redis.onepanel.yaml" \
          "$@"
      }
      if [ "$PULL_BASE_IMAGES" = "true" ]; then
        compose build --pull app admin-web
      else
        compose build app admin-web
      fi
    - |
      set -eu
      export IMAGE_TAG="$CI_COMMIT_SHA"
      export APP_IMAGE="${CI_REGISTRY_IMAGE}/app"
      export ADMIN_WEB_IMAGE="${CI_REGISTRY_IMAGE}/admin-web"
      compose() {
        docker compose \
          --project-directory "$CI_PROJECT_DIR" \
          -f "$CI_PROJECT_DIR/compose.yaml" \
          -f "$CI_PROJECT_DIR/deploy/compose.onepanel.example.yaml" \
          -f "$CI_PROJECT_DIR/deploy/compose.redis.onepanel.yaml" \
          "$@"
      }
      compose push app admin-web
    - |
      set -eu
      export IMAGE_TAG="$CI_COMMIT_SHA"
      export APP_IMAGE="${CI_REGISTRY_IMAGE}/app"
      export ADMIN_WEB_IMAGE="${CI_REGISTRY_IMAGE}/admin-web"
      docker compose \
        --project-directory "$CI_PROJECT_DIR" \
        -f "$CI_PROJECT_DIR/compose.yaml" \
        -f "$CI_PROJECT_DIR/deploy/compose.onepanel.example.yaml" \
        -f "$CI_PROJECT_DIR/deploy/compose.redis.onepanel.yaml" \
        up -d --no-build --no-deps app admin-web
    - |
      set -eu
      export IMAGE_TAG="$CI_COMMIT_SHA"
      export APP_IMAGE="${CI_REGISTRY_IMAGE}/app"
      export ADMIN_WEB_IMAGE="${CI_REGISTRY_IMAGE}/admin-web"
      compose() {
        docker compose \
          --project-directory "$CI_PROJECT_DIR" \
          -f "$CI_PROJECT_DIR/compose.yaml" \
          -f "$CI_PROJECT_DIR/deploy/compose.onepanel.example.yaml" \
          -f "$CI_PROJECT_DIR/deploy/compose.redis.onepanel.yaml" \
          "$@"
      }

      healthy=0
      for attempt in $(seq 1 30); do
        if curl --fail --silent --show-error --max-time 5 -o /dev/null \
            "http://127.0.0.1:${APP_PORT}/-/live" && \
           curl --fail --silent --show-error --max-time 5 -o /dev/null \
            "http://127.0.0.1:${APP_PORT}/-/ready" && \
           curl --fail --silent --show-error --max-time 5 -o /dev/null \
            "http://127.0.0.1:${ADMIN_WEB_PORT}/admin/"; then
          healthy=1
          break
        fi
        sleep 2
      done

      if [ "$healthy" -ne 1 ]; then
        compose ps || true
        compose logs --tail=100 app admin-web || true
        exit 1
      fi

spec:
  inputs:
    pipeline_action:
      type: string
      options:
        - deploy
        - rollback
      default: deploy
      description: "本次流水线执行日常部署或手动回退。"
    public_site_mode:
      type: string
      options:
        - astro
        - go
      default: astro
      description: "本次公网冒烟检查模式；旧 Go 入口环境请显式选择 go。"
    pull_base_images:
      type: boolean
      default: false
      description: "仅本次流水线刷新 Docker 基础镜像。"
    allow_deploy_config_change:
      type: boolean
      default: false
      description: "仅本次允许配置变更；先完成人工备份和兼容性核对。"
    config_change_confirmation:
      type: string
      options:
        - ""
        - I_HAVE_BACKUP_AND_CONFIRMED_COMPATIBILITY
      default: ""
      description: "配置变更前完成人工备份和兼容性确认后，填写确认短语；仅本次有效。"
---
# Only verification jobs use the Docker Runner with the security tag.
# Image build/push and production actions use the Shell Runner with the server tag.

stages:
  - verify
  - build
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

variables:
  MYWEBSITE_RUNNER_TAG: "server"
  MYWEBSITE_SECURITY_RUNNER_TAG: "security"
  COMPOSE_PROJECT_NAME: "mywebsite"
  MYSQL_NETWORK_NAME: "1panel-network"
  APP_PORT: "18080"
  ADMIN_WEB_PORT: "18081"
  SITE_WEB_PORT: "18082"
  GOPROXY: "https://goproxy.cn,direct"
  GOSUMDB: "sum.golang.org"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24.16.0"
  DEPLOY_ROOT: "/opt/mywebsite"
  PRODUCTION_URL: "https://tazmi.online"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"

.verify_job:
  stage: verify
  tags:
    - "$MYWEBSITE_SECURITY_RUNNER_TAG"
  interruptible: true
  timeout: 20 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  rules:
    - if: '"$[[ inputs.pipeline_action ]]" == "rollback"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

.shell_docker_job:
  tags:
    - "$MYWEBSITE_RUNNER_TAG"
  interruptible: false
  variables:
    DOCKER_CONFIG: "$CI_BUILDS_DIR/.mywebsite-docker-config-$CI_JOB_ID"
  after_script:
    - |
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true
      fi
      if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
        rm -rf -- "$DOCKER_CONFIG"
      fi
      if [ -n "${DEPLOY_ROOT:-}" ] && [ -n "${CI_PROJECT_DIR:-}" ] && [ "$DEPLOY_ROOT/deploy/env.production" != "$CI_PROJECT_DIR/deploy/env.production" ]; then
        rm -f -- "$CI_PROJECT_DIR/deploy/env.production"
      fi

.production_job:
  extends: .shell_docker_job
  timeout: 30 minutes
  retry: 0
  variables:
    GIT_DEPTH: "0"
  before_script:
    - |
      export PUBLIC_SITE_MODE='$[[ inputs.public_site_mode ]]'
      export ALLOW_DEPLOY_CONFIG_CHANGE='$[[ inputs.allow_deploy_config_change ]]'
      export CONFIG_CHANGE_CONFIRMATION='$[[ inputs.config_change_confirmation ]]'
      set -eu
      test -n "$CI_REGISTRY"
      test -n "$CI_REGISTRY_USER"
      test -n "$CI_REGISTRY_PASSWORD"
      mkdir -p "$DOCKER_CONFIG" "$CI_PROJECT_DIR/test-results/deploy"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login \
        --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

verify_go:
  extends: .verify_job
  image: golang:1.27.1-alpine
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/
    policy: pull-push
  script:
    - |
      set -eu
      apk add --no-cache bash git >/dev/null
      export GOMODCACHE="$CI_PROJECT_DIR/.cache/go-mod"
      export GOCACHE="$CI_PROJECT_DIR/.cache/go-build"
      export GOTMPDIR=/tmp/gotmp
      export GOBIN=/tmp/bin
      export PATH="$GOBIN:$PATH"
      mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOTMPDIR" "$GOBIN" "$CI_PROJECT_DIR/test-results"
      go install gotest.tools/gotestsum@v1.13.0
      unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
      if [ -n "$unformatted" ]; then
        printf 'gofmt check failed; run gofmt on these files:\n%s\n' "$unformatted" >&2
        exit 1
      fi
      go vet ./...
      gotestsum --junitfile "$CI_PROJECT_DIR/test-results/go-junit.xml" -- ./...
      for script in deploy/scripts/*.sh; do bash -n "$script"; done
      bash deploy/tests/build-scan-test.sh
      bash deploy/tests/deploy-production-test.sh
    - git diff --check
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results/go-junit.xml
    paths:
      - test-results/go-junit.xml

verify_admin:
  extends: .verify_job
  image: node:24.16.0-alpine
  cache:
    key:
      files:
        - web/admin/package-lock.json
    paths:
      - .cache/npm/
    policy: pull-push
  script:
    - |
      set -eu
      apk add --no-cache git >/dev/null
      export NPM_CONFIG_CACHE="$CI_PROJECT_DIR/.cache/npm"
      mkdir -p "$NPM_CONFIG_CACHE" "$CI_PROJECT_DIR/test-results"
      rm -rf /tmp/mywebsite-admin
      cp -R "$CI_PROJECT_DIR/web/admin" /tmp/mywebsite-admin
      cd /tmp/mywebsite-admin
      npm ci --prefer-offline --ignore-scripts --no-audit --no-fund
      npm run typecheck
      npm test -- --reporter=junit --outputFile="$CI_PROJECT_DIR/test-results/admin-junit.xml"
      npm run build
      cd "$CI_PROJECT_DIR"
    - git diff --check
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results/admin-junit.xml
    paths:
      - test-results/admin-junit.xml

verify_site:
  extends: .verify_job
  image: node:24.16.0-alpine
  cache:
    key:
      files:
        - web/site/package-lock.json
    paths:
      - .cache/npm-site/
    policy: pull-push
  script:
    - |
      set -eu
      apk add --no-cache git >/dev/null
      export NPM_CONFIG_CACHE="$CI_PROJECT_DIR/.cache/npm-site"
      mkdir -p "$NPM_CONFIG_CACHE"
      rm -rf /tmp/mywebsite-site
      cp -R "$CI_PROJECT_DIR/web/site" /tmp/mywebsite-site
      cd /tmp/mywebsite-site
      npm ci --prefer-offline --ignore-scripts --no-audit --no-fund
      npm run check
      npm test
      npm run build
      cd "$CI_PROJECT_DIR"
    - git diff --check

build_images:
  extends: .shell_docker_job
  stage: build
  timeout: 45 minutes
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  resource_group: image-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && "$[[ inputs.pipeline_action ]]" == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.pipeline_action ]]" == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - |
      export PULL_BASE_IMAGES='$[[ inputs.pull_base_images ]]'
      bash deploy/scripts/build-images.sh
  artifacts:
    expire_in: 14 days
    reports:
      dotenv: release.env
    paths:
      - release.env

deploy_prod:
  extends: .production_job
  stage: deploy
  resource_group: production
  environment:
    name: production
    url: "$PRODUCTION_URL"
  needs:
    - job: build_images
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && "$[[ inputs.pipeline_action ]]" == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.pipeline_action ]]" == "deploy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash deploy/scripts/deploy-production.sh deploy
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/deploy/

rollback_prod:
  extends: .production_job
  stage: deploy
  resource_group: production
  environment:
    name: production
    url: "$PRODUCTION_URL"
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.pipeline_action ]]" == "rollback" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash deploy/scripts/deploy-production.sh rollback
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-results/deploy/

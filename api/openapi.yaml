openapi: 3.1.0
info:
  title: MyWebsite Admin API
  version: 0.1.0
  description: 管理端会话、文章、项目和媒体资源 API。
servers:
  - url: /api/v1
    description: 当前站点 API 根路径
tags:
  - name: session
    description: 管理员会话
  - name: articles
    description: 文章管理
  - name: projects
    description: 项目管理
  - name: media
    description: 媒体资源
paths:
  /session:
    post:
      tags: [session]
      operationId: createSession
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [session]
      operationId: getSession
      summary: 读取当前会话
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [session]
      operationId: revokeSession
      summary: 退出登录
      security:
        - sessionCookie: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /session/reauth:
    post:
      tags: [session]
      operationId: reauthenticateSession
      summary: 重新认证并轮换会话
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /articles:
    get:
      tags: [articles]
      operationId: listArticles
      summary: 查询文章列表
      description: 支持标题搜索、状态筛选和分页；每页默认 20 篇。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: q
          in: query
          description: 标题搜索词
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published]
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [articles]
      operationId: createArticle
      summary: 创建草稿
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /articles/{id}:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    get:
      tags: [articles]
      operationId: getArticle
      summary: 读取文章编辑数据
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [articles]
      operationId: updateArticle
      summary: 保存完整文章编辑状态
      description: 更新和发布均使用记录 version 做乐观锁校验。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /articles/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    post:
      tags: [articles]
      operationId: publishArticle
      summary: 原子发布文章
      description: 携带完整编辑状态保存并发布文章。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /articles/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ArticleID'
    post:
      tags: [articles]
      operationId: withdrawArticle
      summary: 撤回文章
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleVersionRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 查询项目分组
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/ProjectGroups'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [projects]
      operationId: createProject
      summary: 创建隐藏项目
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/ProjectCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      tags: [projects]
      operationId: getProject
      summary: 读取项目编辑数据
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/ProjectEdit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [projects]
      operationId: updateProject
      summary: 保存完整项目编辑状态
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProjectUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [projects]
      operationId: publishProject
      summary: 原子公开项目
      description: 携带完整项目表单并在排序集合锁内追加公开项目。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPublishRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProjectPublished'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{id}/hide:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      tags: [projects]
      operationId: hideProject
      summary: 隐藏项目
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectHideRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/order:
    put:
      tags: [projects]
      operationId: updateProjectOrder
      summary: 原子保存公开项目顺序
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProjectOrderUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /media:
    post:
      tags: [media]
      operationId: uploadMedia
      summary: 上传媒体资源
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件。
      responses:
        '201':
          $ref: '#/components/responses/MediaCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /media/{id}:
    parameters:
      - $ref: '#/components/parameters/MediaID'
    get:
      tags: [media]
      operationId: getMedia
      summary: 读取媒体资源
      description: 管理员预览二进制媒体资源；公开站路由 GET /media/{id} 不属于本 API 的 /api/v1 server 范围。
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/MediaBinary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: 本地 HTTP 开发使用名为 session 的 Cookie；生产环境 COOKIE_SECURE=true 时实际 Cookie 名为 __Host-session。name 保留为 session 作为开发与 OpenAPI 工具基准。

  parameters:
    ArticleID:
      name: id
      in: path
      required: true
      description: 文章内部 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
    ProjectID:
      name: id
      in: path
      required: true
      description: 项目内部 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
    MediaID:
      name: id
      in: path
      required: true
      description: 媒体资源公开 ULID。
      schema:
        $ref: '#/components/schemas/ULID'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 20
        default: 20

  responses:
    OK:
      description: 请求成功。
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Session'
              - $ref: '#/components/schemas/ArticleListResponse'
              - $ref: '#/components/schemas/ArticleEdit'
    Created:
      description: 资源创建成功。
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ArticleEdit'
    ProjectGroups:
      description: 项目公开组、隐藏组及当前排序集合版本。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectGroups'
    ProjectCreated:
      description: 隐藏项目创建成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEdit'
    ProjectEdit:
      description: 项目编辑数据读取成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEdit'
    ProjectUpdated:
      description: 项目更新成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEdit'
    ProjectPublished:
      description: 项目公开成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectEdit'
    ProjectOrderUpdated:
      description: 项目公开顺序更新成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectOrderResult'
    MediaCreated:
      description: 媒体资源上传成功。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MediaAsset'
    MediaBinary:
      description: 管理员媒体预览二进制内容。
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
    NoContent:
      description: 请求成功，无响应正文。
    BadRequest:
      description: 请求语法错误。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: 未登录、凭据无效或会话已过期。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: 已登录但没有权限或 CSRF 校验失败。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: 资源不存在。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 版本或排序集合版本冲突。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RequestEntityTooLarge:
      description: 请求体或上传文件过大。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: 不支持的请求媒体类型。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: 字段或业务校验失败。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: 请求过于频繁。
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: 服务器内部错误。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: 数据库或必要依赖暂时不可用。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ULID:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: Crockford Base32 编码的公开 ULID。
    ProblemDetails:
      type: object
      required: [type, title, status, code, request_id, errors]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        code:
          type: string
          description: 稳定机器可读错误码。
          enum:
            - validation_failed
            - authentication_required
            - session_expired
            - csrf_failed
            - version_conflict
            - github_repository_invalid
            - github_verification_unavailable
            - upload_too_large
            - upload_type_invalid
            - image_dimensions_exceeded
            - invalid_media_reference
            - image_alt_required
            - image_alt_invalid
            - referenced_media_not_found
            - invalid_actor
            - internal_error
            - save_failed
            - invalid_request
            - not_found
            - unsupported_media_type
            - rate_limited
            - dependency_unavailable
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      required: [username, password]
